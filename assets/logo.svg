      <stop offset="0%" stop-color="#4FE3C1" stop-opacity=".13"/>
      <stop offset="62%" stop-color="#4FE3C1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- tile: same chamfered silhouette the app uses for every card -->
  <path d="M28 0 H880 V292 L852 320 H0 V28 Z" fill="#0B0D10"/>
  <path d="M28 0 H880 V292 L852 320 H0 V28 Z" fill="url(#glow)"/>
  <path d="M52 24 H856 V284 L836 304 H24 V44 Z" fill="none" stroke="#4FE3C1" stroke-opacity=".22" stroke-width="3"/>

  <!-- barbell mark -->
